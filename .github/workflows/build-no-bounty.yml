name: Build NeverWanted Runtime Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/no-bounty/NeverWantedRuntime.cpp'
      - '.github/workflows/build-no-bounty.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build x64 ASI
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++20 /O2 /EHsc /W4 /LD mods\no-bounty\NeverWantedRuntime.cpp /link /OUT:dist\NeverWanted_DesertLink_v1.1_TEST.asi /MACHINE:X64

      - name: Package
        shell: pwsh
        run: |
          Copy-Item mods\no-bounty\README_RUNTIME_TEST.md dist\README.txt
          Compress-Archive -Path dist\NeverWanted_DesertLink_v1.1_TEST.asi,dist\README.txt -DestinationPath dist\NeverWanted_DesertLink_v1.1_TEST.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeverWanted-DesertLink-v1.1-TEST
          path: |
            dist/NeverWanted_DesertLink_v1.1_TEST.asi
            dist/NeverWanted_DesertLink_v1.1_TEST.zip
            dist/README.txt
