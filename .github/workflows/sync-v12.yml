name: Apply DesertLink v1.2 Source Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.2 source tree
        shell: bash
        run: |
          set -euo pipefail

          cat .source-update.part* > "$RUNNER_TEMP/desertlink-v12.b64"
          base64 --decode "$RUNNER_TEMP/desertlink-v12.b64" > "$RUNNER_TEMP/desertlink-v12.tar.gz"

          expected='42ccfa15b6fc03424b828d9ce1c88b3f300b225de32780509c36a087dd4de405'
          actual="$(sha256sum "$RUNNER_TEMP/desertlink-v12.tar.gz" | awk '{print $1}')"
          test "$actual" = "$expected"

          tar -xzf "$RUNNER_TEMP/desertlink-v12.tar.gz" -C .

          rm -f .source-update.tar.gz .source-update.part*
          rm -f .github/workflows/build-no-bounty.yml
          rm -f README_GITHUB_BUILD.txt
          rm -f docs/DESERTLINK_PROJECT_STATE.md
          rm -f docs/EMAIL_TO_NEXUS.txt
          rm -f core/DesertLinkCore_v1.0.7.asi
          rm -f installer/DesertLinkSetup.cpp
          rm -f installer/chkstk.s
          rm -rf mods/no-bounty
          rm -f .github/workflows/sync-v12.yml

          git config user.name 'DesertLink Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Update Map Companion source to v1.2'
          git push
